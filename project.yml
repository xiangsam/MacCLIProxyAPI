name: MacCLIProxyAPI
options:
  bundleIdPrefix: com.maccliproxyapi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: "5.1.0"
targets:
  MacCLIProxyAPI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
      - path: Core
      # The app rebuilds a patched core after an upstream core update, so it ships
      # the same script and patches the repo uses. The folder reference keeps the
      # directory name the script expects.
      - path: patches
        type: folder
        buildPhase: resources
      - path: scripts/build-core.sh
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccliproxyapi.app
        PRODUCT_NAME: MacCLIProxyAPI
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: false
        ENABLE_HARDENED_RUNTIME: false
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
    scheme:
      testTargets:
        - MacCLIProxyAPITests
  MacCLIProxyAPITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MacCLIProxyAPI
      - package: Yams
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maccliproxyapi.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacCLIProxyAPI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MacCLIProxyAPI"
        BUNDLE_LOADER: "$(TEST_HOST)"
